name: Relationship sync worker

on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

permissions:
  contents: read

# One worker at a time; a slow run is never cancelled mid-batch.
concurrency:
  group: sync-worker
  cancel-in-progress: false

jobs:
  sync:
    name: sync worker
    if: github.repository == 'Vanquish-Equity/vanquish-os'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      # Secrets are only exposed to this step. The worker logs bounded status
      # lines (no tokens, addresses or raw errors); do not add `set -x` or env dumps.
      - name: Run worker
        run: npm run sync:worker
        env:
          LP_SCOUTING_WORKER_ENABLED: ${{ vars.LP_SCOUTING_WORKER_ENABLED }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_WORKER_EMAIL: ${{ secrets.SUPABASE_WORKER_EMAIL }}
          SUPABASE_WORKER_PASSWORD: ${{ secrets.SUPABASE_WORKER_PASSWORD }}
          SUPABASE_WORKER_USER_ID: ${{ secrets.SUPABASE_WORKER_USER_ID }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          MAILBOX_TOKEN_ENCRYPTION_KEY: ${{ secrets.MAILBOX_TOKEN_ENCRYPTION_KEY }}
