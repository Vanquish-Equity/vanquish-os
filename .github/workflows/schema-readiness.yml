name: Preview schema readiness

on:
  workflow_run:
    workflows: [Application checks]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

# This workflow runs from main's trusted code. It reads only the PR commit's
# tree; it never checks out or executes code from a PR with a database secret.
jobs:
  schema:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_SCHEMA_READONLY_URL: ${{ secrets.SUPABASE_SCHEMA_READONLY_URL }}
      HEAD_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Compare required and applied migrations
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$SUPABASE_SCHEMA_READONLY_URL" ]]; then
            echo 'Set SUPABASE_SCHEMA_READONLY_URL to a read-only database connection URL.' >&2
            exit 1
          fi
          if ! command -v psql > /dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq postgresql-client
          fi
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/${{ github.repository }}/git/trees/$HEAD_SHA?recursive=1" \
            -o "$RUNNER_TEMP/source-tree.json"
          # libpq may echo fragments of a malformed URL, including its password.
          # Keep its diagnostics off the public Actions log.
          if ! psql "$SUPABASE_SCHEMA_READONLY_URL" -X -A -t -v ON_ERROR_STOP=1 \
            -c 'select name from supabase_migrations.schema_migrations' \
            > "$RUNNER_TEMP/applied-migrations.txt" 2> "$RUNNER_TEMP/psql-error.txt"; then
            # Classify errors without printing libpq's raw stderr: it can
            # contain a password fragment from a malformed connection URL.
            if grep -Eqi 'invalid percent-encoded|invalid URI|invalid connection option' "$RUNNER_TEMP/psql-error.txt"; then
              echo 'Schema readiness: malformed database URL. Remove placeholder brackets and percent-encode reserved password characters.' >&2
            elif grep -Eqi 'password authentication failed|no password supplied' "$RUNNER_TEMP/psql-error.txt"; then
              echo 'Schema readiness: database password authentication failed. Check the role name and rotated password.' >&2
            elif grep -Eqi 'tenant or user not found|role .* does not exist' "$RUNNER_TEMP/psql-error.txt"; then
              echo 'Schema readiness: database role or pooler project reference was not found.' >&2
            elif grep -Eqi 'permission denied' "$RUNNER_TEMP/psql-error.txt"; then
              echo 'Schema readiness: role lacks access to the migration history.' >&2
            elif grep -Eqi 'could not translate host name|connection refused|timed out|network is unreachable' "$RUNNER_TEMP/psql-error.txt"; then
              echo 'Schema readiness: database host or network connection failed.' >&2
            else
              echo 'Schema readiness: database query failed. Check the session pooler URL and TLS settings.' >&2
            fi
            exit 1
          fi
          python3 scripts/check_schema_drift.py \
            --tree "$RUNNER_TEMP/source-tree.json" \
            --applied "$RUNNER_TEMP/applied-migrations.txt"
