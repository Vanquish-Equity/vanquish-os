name: Contextual comments database checks
on:
  pull_request:
    paths:
      - 'supabase/migrations/**'
      - 'supabase/tests/**'
      - '.github/workflows/contextual-comments.yml'
jobs:
  sql:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: vanquish_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d vanquish_test"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: vanquish_test
    steps:
      - uses: actions/checkout@v4
      - name: Apply migrations twice and test access
        shell: bash
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -f supabase/tests/local_bootstrap.sql
          for n in $(seq -w 1 23); do
            file=$(find supabase/migrations -maxdepth 1 -name "00${n}_*.sql" -print -quit)
            if [[ -z "$file" ]]; then echo "Missing migration 00${n}"; exit 1; fi
            psql -v ON_ERROR_STOP=1 -f "$file" > /dev/null
          done
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/0021_contextual_comments.sql > /dev/null
          psql -v ON_ERROR_STOP=1 -f supabase/tests/contextual_comments.sql > /dev/null
          psql -v ON_ERROR_STOP=1 -f supabase/tests/record_comments.sql > /dev/null
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/0022_member_profiles.sql > /dev/null
          psql -v ON_ERROR_STOP=1 -f supabase/tests/member_profiles.sql > /dev/null
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/0023_admin_settings.sql > /dev/null
          psql -v ON_ERROR_STOP=1 -f supabase/tests/admin_settings.sql > /dev/null
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20260928200209_crm_boards.sql > /dev/null
          psql -v ON_ERROR_STOP=1 -f supabase/tests/crm_boards.sql > /dev/null
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20260928202810_board_customization.sql > /dev/null
          psql -v ON_ERROR_STOP=1 -f supabase/tests/board_customization.sql > /dev/null
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20260928203809_deal_assignees.sql > /dev/null
          psql -v ON_ERROR_STOP=1 -f supabase/tests/deal_assignees.sql > /dev/null
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20260928204419_flexible_boards.sql > /dev/null
          psql -v ON_ERROR_STOP=1 -f supabase/tests/flexible_boards.sql > /dev/null
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20260928205500_board_item_assignees.sql > /dev/null
          psql -v ON_ERROR_STOP=1 -f supabase/tests/board_item_assignees.sql > /dev/null
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20260929000100_board_item_checklists.sql > /dev/null
          psql -v ON_ERROR_STOP=1 -f supabase/tests/board_item_checklists.sql > /dev/null
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20260929000200_boards_context_comments.sql > /dev/null
          psql -v ON_ERROR_STOP=1 -f supabase/tests/boards_context_comments.sql > /dev/null
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20260929160308_personal_lp_board.sql > /dev/null
          psql -v ON_ERROR_STOP=1 -f supabase/tests/personal_lp_board.sql > /dev/null
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20260929162121_lp_board_card_fk_index.sql > /dev/null
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20260929162736_people_groups.sql > /dev/null
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20260929163000_protect_potential_lp_group.sql > /dev/null
          psql -v ON_ERROR_STOP=1 -f supabase/tests/people_groups.sql > /dev/null
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20260929170500_email_recipient_fields.sql > /dev/null
          psql -v ON_ERROR_STOP=1 -f supabase/tests/email_recipient_fields.sql > /dev/null
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20260929173000_board_directory_import.sql > /dev/null
          psql -v ON_ERROR_STOP=1 -f supabase/tests/board_directory_import.sql > /dev/null
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20260929180000_draft_formatting_and_schedule.sql > /dev/null
          psql -v ON_ERROR_STOP=1 -f supabase/tests/draft_formatting_and_schedule.sql > /dev/null
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20260929190000_email_scouting_permission.sql > /dev/null
          psql -v ON_ERROR_STOP=1 -f supabase/tests/email_scouting_permission.sql > /dev/null
